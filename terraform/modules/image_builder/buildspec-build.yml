version: 0.2
env:
  shell: bash
phases:
  build:
    commands:
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        [[ "${SOURCE_ID:-}" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "SOURCE_ID is required (letters, digits, . _ -)"; exit 1; }
        REPO_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
        TAG="build-$SOURCE_ID"
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
        EXTRA=()
        if [ -n "${CORE_CONTEXT_DIR:-}" ]; then
          EXTRA+=(--build-context core="$CODEBUILD_SRC_DIR/$CORE_CONTEXT_DIR")
        fi
        for arg in ${BUILD_ARGS:-}; do EXTRA+=(--build-arg "$arg"); done
        docker build --pull -f "$CODEBUILD_SRC_DIR/$DOCKERFILE" "${EXTRA[@]}" -t "$REPO_URI:$TAG" "$CODEBUILD_SRC_DIR/$CONTEXT_DIR"
        docker push "$REPO_URI:$TAG"
        DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$TAG" --query 'imageDetails[0].imageDigest' --output text)
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest recorded for $TAG"; exit 1; }
        printf '{"image":"%s@%s","digest":"%s"}\n' "$REPO_URI" "$DIGEST" "$DIGEST" > "$CODEBUILD_SRC_DIR/build-record.json"
        aws s3 cp "$CODEBUILD_SRC_DIR/build-record.json" "s3://$OUTPUT_BUCKET/$OUTPUT_PREFIX/$SERVICE/$SOURCE_ID.json" --sse aws:kms
        echo "IMAGE=$REPO_URI@$DIGEST"
