name: infrastructure-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test dependencies (pinned)
        run: python -m pip install -r tests/requirements.txt
      - name: Test portable infrastructure contracts (not stack readiness)
        run: python -m unittest discover -s tests -v
      - name: Documentation matches the code (subcommands, flags, variables, modules, links)
        run: python -m unittest tests.test_docs_consistency -v
      - name: Test aws-prod.ps1 and release-engine.ps1 guards (Pester 3.4, fake aws and terraform)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester scripts/tests -EnableExit
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform roots without credentials or remote state
        shell: pwsh
        run: |
          # Staging validates first; prod is the hackathon demo environment.
          # This is validation only: no credentials, plan, apply or deploy.
          foreach ($environment in "staging", "prod") {
            terraform -chdir="terraform/envs/$environment" init -backend=false -input=false -lockfile=readonly
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            terraform -chdir="terraform/envs/$environment" validate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test IAM and ECS secret-reference guards without cloud access
        shell: pwsh
        run: |
          terraform -chdir=terraform/modules/identity init -backend=false -input=false -lockfile=readonly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform -chdir=terraform/modules/identity test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform -chdir=terraform/modules/compute init -backend=false -input=false -lockfile=readonly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform -chdir=terraform/modules/compute test
      - name: Test Agent Core scale-out modules without cloud access
        shell: pwsh
        run: |
          foreach ($module in "ecr", "rds_proxy", "core_data", "scheduled_task", "core_alarms") {
            terraform "-chdir=terraform/modules/$module" init -backend=false -input=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            terraform "-chdir=terraform/modules/$module" test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test data pipeline modules without cloud access
        shell: pwsh
        run: |
          foreach ($module in "data_lake", "data_pipeline") {
            terraform "-chdir=terraform/modules/$module" init -backend=false -input=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            terraform "-chdir=terraform/modules/$module" test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test hackathon single-host compute and composition without cloud access
        shell: pwsh
        run: |
          foreach ($dir in "modules/hackathon_network", "modules/hackathon_iam", "modules/hackathon_data", "modules/hackathon_compute", "modules/image_builder", "modules/deployer_policies", "modules/engine_task", "bootstrap", "envs/hackathon") {
            terraform "-chdir=terraform/$dir" init -backend=false -input=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            terraform "-chdir=terraform/$dir" validate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            terraform "-chdir=terraform/$dir" test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test hackathon edge module (validated through the env composition, which supplies the us_east_1 alias)
        shell: pwsh
        run: |
          terraform -chdir=terraform/modules/hackathon_edge init -backend=false -input=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform -chdir=terraform/modules/hackathon_edge test
