name: infrastructure-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test portable infrastructure contracts (not stack readiness)
        run: python -m unittest discover -s tests -v
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform roots without credentials or remote state
        shell: pwsh
        run: |
          # Staging validates first; prod is the hackathon demo environment.
          # This is validation only: no credentials, plan, apply or deploy.
          foreach ($environment in "staging", "prod") {
            terraform -chdir="terraform/envs/$environment" init -backend=false -input=false -lockfile=readonly
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            terraform -chdir="terraform/envs/$environment" validate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test IAM and ECS secret-reference guards without cloud access
        shell: pwsh
        run: |
          terraform -chdir=terraform/modules/identity init -backend=false -input=false -lockfile=readonly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform -chdir=terraform/modules/identity test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform -chdir=terraform/modules/compute init -backend=false -input=false -lockfile=readonly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          terraform -chdir=terraform/modules/compute test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Agent Core scale-out guards without cloud access
        shell: pwsh
        run: |
          foreach ($module in "agent_core_network", "ecr", "rds_proxy", "agent_core_data", "agent_core_workload") {
            terraform -chdir=terraform/modules/$module init -backend=false -input=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            terraform -chdir=terraform/modules/$module test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
