name: isolated-postgres-integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  artifact-migration:
    name: artifact migration (isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # This credential exists only inside GitHub's disposable service network.
      # It is intentionally not a repository/environment secret.
      PULSO_ALLOW_DESTRUCTIVE_TEST_DB: "1"
      PULSO_TEST_POSTGRES_URL: postgresql://pulso_ci:pulso-ci-isolated-only@localhost:5432/pulso_ci
    services:
      postgres:
        image: postgres:17-alpine@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
        env:
          POSTGRES_DB: pulso_ci
          POSTGRES_USER: pulso_ci
          POSTGRES_PASSWORD: pulso-ci-isolated-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulso_ci -d pulso_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Run explicitly gated PostgreSQL migration test
        run: >-
          cargo +1.98.1 test --locked --package improvement-engine-core
          --test postgres_artifact_migration -- --ignored
