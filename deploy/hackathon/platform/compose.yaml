# Hackathon platform host. Project dir on the host: /srv/stack (synced from S3 by pulso-stack-prepare).
# Images are digest variables in .env; secrets come from /run/pulso/env/<svc>.env (tmpfs, 0600),
# rendered from this host's slice of the one Secrets Manager secret.
name: pulso

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  internal: {}

services:
  support-platform-api:
    image: ${SUPPORT_API_IMAGE:?set}
    # AGENT_KEYS_JSON (secret key SUPPORT__AGENT_KEYS_JSON, generated by Terraform) is written to /tmp before uvicorn starts, so
    # no host file or start-script change is needed. The command repeats the image's own CMD (backend/Dockerfile): keep in sync.
    entrypoint:
      - /bin/sh
      - -c
      - umask 077; printf '%s' "$$AGENT_KEYS_JSON" > /tmp/agent-keys.json; exec "$$@"
      - support-platform
    command: ["uvicorn", "cc_platform.bootstrap.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
    mem_limit: 512m
    env_file: [/run/pulso/env/common.env, /run/pulso/env/support.env]
    environment:
      # The shared Core is agent-core's own `agentcore serve` (ADR 0009). URL and key file go together or not at all. The file
      # holds the platform's private Ed25519 seeds (principal, delegation, staff), generated by Terraform; the Core's
      # identity-keys and staff-keys files carry the matching public keys. CC_INTERNAL_SERVICE_TOKEN comes from support.env.
      CC_AGENT_CORE_URL: http://core.${PRIVATE_ZONE_NAME:?set}:8000
      CC_AGENT_KEYS_FILE: /tmp/agent-keys.json
    volumes:
      - /srv/data/support:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    networks: [internal]

  support-platform-web:
    image: ${SUPPORT_WEB_IMAGE:?set}
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [internal]

  # Internal listener for the Core's grant_active check: only /api/v1/internal/grants/*, no X-Origin-Verify (the Core cannot send
  # it), reachable only from the core security group (hackathon_network). The platform still requires its bearer token.
  internal-proxy:
    image: ${PROXY_IMAGE:?set}
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "8081:8081"
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
    depends_on:
      support-platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [internal]

  proxy:
    image: ${PROXY_IMAGE:?set}
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
    env_file: [/run/pulso/env/common.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      support-platform-api:
        condition: service_healthy
      support-platform-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [internal]
