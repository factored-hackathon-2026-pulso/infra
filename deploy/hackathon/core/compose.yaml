# Hackathon core host. Project dir on the host: /srv/stack (synced from S3 by pulso-stack-prepare).
# Images are digest variables in .env; secrets come from /run/pulso/env/<svc>.env (tmpfs, 0600),
# rendered from this host's slice of the one Secrets Manager secret.
name: pulso

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  internal: {}

services:
  core-migrate:
    image: ${CORE_IMAGE:?set}
    command: ["migrate"]
    environment:
      AGENTCORE_BLOB_BUCKET: ${BUCKET_NAME:?set}
    restart: "no"
    mem_limit: 256m
    user: "10001:10001"
    env_file: [/run/pulso/env/common.env, /run/pulso/env/core.env]
    logging: *logging
    networks: [internal]

  # agent-core's own image (ADR 0009): `agentcore serve` is the shared Core (runs API :8000 and, with --registry-api, the
  # registry and export APIs). The image is built from agent-core's Dockerfile at a pinned commit (ADR 0003) and deployed by
  # digest. Config is env (AGENTCORE_*): SSM -> core.env, secrets -> core.env, the two public key documents -> /tmp (see entrypoint).
  core-runtime:
    image: ${CORE_IMAGE:?set}
    # The key documents arrive as env values (secret keys CORE__IDENTITY_KEYS_JSON and CORE__STAFF_KEYS_JSON, generated by
    # Terraform) and are written to /tmp before the service starts; the stock entrypoint `agentcore` then runs the command below.
    entrypoint:
      - /bin/sh
      - -c
      - umask 077; printf '%s' "$$IDENTITY_KEYS_JSON" > /tmp/identity-keys.json; printf '%s' "$$STAFF_KEYS_JSON" > /tmp/staff-keys.json; exec agentcore "$$@"
      - agentcore
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --identity-keys
      - /tmp/identity-keys.json
      - --staff-keys
      - /tmp/staff-keys.json
      - --registry-api
      - --tools
      - agent_core.adapters.tools:http_tool_executor
      - --authz
      - agent_core.adapters.policy_authz:policy_authz
      - --field-classifier
      - agent_core.adapters.classification:field_classifier
      - --grant-active
      - agent_core.adapters.grants:http_grant_active
      # No real implementation of these three exists in agent-core yet (agent-core docs/specs/TEMAS-ABIERTOS-PENDIENTES.md):
      # modulo:atributo comes from .env (core_serve_pieces in Terraform). Unset = the serve process refuses to start
      # (fail closed) and the deploy rolls back; no demo double is ever enabled (the demo switch is never set).
      - --transcript
      - ${AGENTCORE_PIECE_TRANSCRIPT:-}
      - --calibration
      - ${AGENTCORE_PIECE_CALIBRATION:-}
      - --classifier
      - ${AGENTCORE_PIECE_CLASSIFIER:-}
    restart: unless-stopped
    mem_limit: 768m
    user: "10001:10001"
    env_file: [/run/pulso/env/common.env, /run/pulso/env/core.env]
    environment:
      AGENTCORE_BLOB_BUCKET: ${BUCKET_NAME:?set}
      AGENTCORE_BLOB_PREFIX: ${CORE_BLOB_PREFIX:-core/blobs/}
      AGENTCORE_LLM_GATEWAY_URL: http://llm-gateway:8080
      # The data-governance catalogue (data-pipeline field_classification.json) is not shipped here: only the overlay of
      # the engine's own fields. A field no file classifies stays pii_direct (agent-core's safe default).
      AGENTCORE_FIELD_CLASSIFICATION_FILES: /etc/agentcore/field-overlay.json
      # The tool service accepts either name for the bound subject parameter (agent-core scripts/e2e/serve-tools.ps1).
      AGENTCORE_AUTHZ_BIND_KEYS: subject_ref,customer_id
      # grant_active asks the platform's /api/v1/internal/grants (bearer AGENTCORE_GRANTS_TOKEN) over the internal listener.
      AGENTCORE_GRANTS_URL: http://platform.${PRIVATE_ZONE_NAME:?set}:8081
    volumes:
      - ./field-overlay.json:/etc/agentcore/field-overlay.json:ro
    # Reachable from the platform and engine hosts as http://core.<private zone>:8000 (security group limited): /v1/runs,
    # /v1/registry/*, /v1/export/* and /registry-events.
    ports:
      - "8000:8000"
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      llm-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    networks: [internal]

  llm-gateway:
    image: ${GATEWAY_IMAGE:?set}
    restart: unless-stopped
    mem_limit: 128m
    env_file: [/run/pulso/env/common.env, /run/pulso/env/gateway.env]
    # Published so the engine host can reach it as http://core.<private zone>:8080 (security group: engine only). Every
    # consumer authenticates with its own bearer token (GATEWAY_CONSUMERS); the host-local core-runtime uses the compose name.
    ports:
      - "8080:8080"
    # Distroless image has no shell or curl; /healthz :8080 is probed by the proxy-side smoke test.
    healthcheck:
      disable: true
    logging: *logging
    networks: [internal]
