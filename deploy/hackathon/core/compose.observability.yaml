# OTLP forwarder sidecars on the core host (Terraform variable otlp_forwarder_enabled, default false; docs/otlp-forwarder.md; decision
# B1). The forwarder (engine repo scripts/o11y/otlp_forwarder.py) is the single egress to Langfuse for the gateway and agent-core. It
# listens on 127.0.0.1 ONLY, so each sidecar shares the network namespace of its producer (network_mode: service:<producer>) and the
# producer exports OTLP/protobuf to http://127.0.0.1:4318. The Langfuse keys live ONLY in langfuse.env (secret keys
# LANGFUSE__LANGFUSE_BASE_URL, LANGFUSE__LANGFUSE_PUBLIC_KEY, LANGFUSE__LANGFUSE_SECRET_KEY, service env "langfuse"); the producers
# never see them. Merged after compose.agents.yaml. Needs FORWARDER_IMAGE (images.core.forwarder).
# Content: prompts and responses are NOT exported unless the variable otlp_trace_content is true (OTLP_TRACE_CONTENT=1 in .env), which
# sets LLM_GATEWAY_TRACE_CONTENT (llm-gateway) and AGENTCORE_TRACE_CONTENT (agent-core audit view) together.
services:
  llm-gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      OTEL_SERVICE_NAME: llm-gateway
      LLM_GATEWAY_TRACE_CONTENT: ${OTLP_TRACE_CONTENT:-0}

  agent-core:
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: agent-core
      AGENTCORE_TRACE_LANGFUSE: "1"
      AGENTCORE_TRACE_CONTENT: ${OTLP_TRACE_CONTENT:-0}

  otlp-forwarder-gateway:
    image: ${FORWARDER_IMAGE:?set}
    network_mode: "service:llm-gateway"
    restart: unless-stopped
    mem_limit: 96m
    user: "10001:10001"
    env_file: [/run/pulso/env/common.env, /run/pulso/env/langfuse.env]
    depends_on:
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4318/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otlp-forwarder-agent:
    image: ${FORWARDER_IMAGE:?set}
    network_mode: "service:agent-core"
    restart: unless-stopped
    mem_limit: 96m
    user: "10001:10001"
    env_file: [/run/pulso/env/common.env, /run/pulso/env/langfuse.env]
    depends_on:
      agent-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4318/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
